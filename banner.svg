<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" width="100%">
  <defs>
    <style><![CDATA[
      @keyframes scan      { 0% { transform: translateY(-10px); } 100% { transform: translateY(310px); } }
      @keyframes scanGlow  { 0% { transform: translateY(-80px); } 100% { transform: translateY(310px); } }
      @keyframes ghostA {
        0%, 95%, 100% { transform: translate(3px, 0);    opacity: 0.16; }
        96%           { transform: translate(6px, -1px); opacity: 0.45; }
        97%           { transform: translate(2px, 1px);  opacity: 0.30; }
        98%           { transform: translate(3px, 0);    opacity: 0.16; }
      }
      @keyframes ghostB {
        0%, 95%, 100% { transform: translate(-3px, 0);     opacity: 0.16; }
        96%           { transform: translate(-6px, 1px);   opacity: 0.45; }
        97%           { transform: translate(-2px, -1px);  opacity: 0.30; }
        98%           { transform: translate(-3px, 0);     opacity: 0.16; }
      }
      @keyframes bit { 0%, 49.999% { opacity: 0; } 50%, 100% { opacity: 1; } }

      .scan-main { animation: scan     4.5s linear infinite; }
      .scan-glow { animation: scanGlow 4.5s linear infinite; }
      .ghost-a   { animation: ghostA   4s linear infinite; }
      .ghost-b   { animation: ghostB   4s linear infinite; }

      .b0 { animation: bit   2s step-end infinite; }
      .b1 { animation: bit   4s step-end infinite; }
      .b2 { animation: bit   8s step-end infinite; }
      .b3 { animation: bit  16s step-end infinite; }
      .b4 { animation: bit  32s step-end infinite; }
      .b5 { animation: bit  64s step-end infinite; }
      .b6 { animation: bit 128s step-end infinite; }
      .b7 { animation: bit 256s step-end infinite; }
    ]]></style>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ededed" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ededed" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0a0a0a"/>

  <g stroke="#1a1a1d" stroke-width="0.5">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
  </g>

  <g stroke="#6b6b70" stroke-width="1" fill="none">
    <path d="M 30 30 L 30 64 M 30 30 L 64 30"/>
    <path d="M 1170 30 L 1170 64 M 1170 30 L 1136 30"/>
    <path d="M 30 270 L 30 236 M 30 270 L 64 270"/>
    <path d="M 1170 270 L 1170 236 M 1170 270 L 1136 270"/>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#6b6b70" letter-spacing="3">
    <text x="42"   y="50">[ ID ] 0X_TT1NKER</text>
    <text x="966"  y="50">[ ALIVE ]</text>
    <text x="42"   y="262">[ ARCH ] LINUX X86_64</text>
    <text x="1158" y="262" text-anchor="end">[ DOB ] <tspan fill="#ededed">0b11111010101.1010.10110</tspan></text>
  </g>

  <g transform="translate(1042 38)">
    <g transform="translate(0 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b7"/>
    </g>
    <g transform="translate(16 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b6"/>
    </g>
    <g transform="translate(32 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b5"/>
    </g>
    <g transform="translate(48 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b4"/>
    </g>
    <g transform="translate(68 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b3"/>
    </g>
    <g transform="translate(84 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b2"/>
    </g>
    <g transform="translate(100 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b1"/>
    </g>
    <g transform="translate(116 0)">
      <rect width="12" height="12" fill="none" stroke="#6b6b70" stroke-width="1"/>
      <rect width="12" height="12" fill="#ededed" class="b0"/>
    </g>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="140" font-weight="200" letter-spacing="6" text-anchor="middle">
    <text x="600" y="190" fill="#ededed" class="ghost-a">TT1NKER</text>
    <text x="600" y="190" fill="#ededed" class="ghost-b">TT1NKER</text>
    <text x="600" y="190" fill="#ededed">TT1NKER</text>
  </g>

  <text x="600" y="232" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b6b70" letter-spacing="12">// SYSTEMS · AGENTS · SIM</text>

  <rect x="0" y="0" width="1200" height="60" fill="url(#scanGrad)" opacity="0.16" class="scan-glow"/>
  <rect x="0" y="0" width="1200" height="2"  fill="#ededed"        opacity="0.40" class="scan-main"/>
</svg>
