  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0042;0.7770;0.7890;1" dur="26.90s" repeatCount="indefinite"/>
  <text class="txt prompt" x="24" y="42">$ </text>
  <text class="txt" x="40.8" y="42">whoami</text>
</g>
