<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 650" width="100%" preserveAspectRatio="xMidYMid meet">
<defs>
<style><![CDATA[
.bg { fill: #0a0a0a; }
.txt { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #ededed; white-space: pre; }
.prompt { fill: #6b6b70; }
.thought { fill: #c8c8c8; }
]]></style>
</defs>
<rect class="bg" width="686" height="650"/>
