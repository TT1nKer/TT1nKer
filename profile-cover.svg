<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">TT1nKer — question-driven systems lab</title>
  <desc id="desc">An animated black systems console with bold TT1NKER typography, signal colors, and a question mark instrument.</desc>
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none; }
      }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f1efe7" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="titleClip"><rect x="54" y="140" width="760" height="190"/></clipPath>
  </defs>

  <rect width="1280" height="560" fill="#0b0b0d"/>
  <rect width="1280" height="560" fill="url(#grid)"/>
  <path d="M0 86H1280M0 448H1280M52 0V560M1228 0V560" stroke="#f1efe7" stroke-opacity=".14"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.5">
    <text x="76" y="52" fill="#f1efe7">[ TT1? / SYSTEMS LAB ]</text>
    <text x="1204" y="52" text-anchor="end" fill="#85858d">TTINKER.NET · NODE 01</text>
    <circle cx="62" cy="48" r="4" fill="#cfff2e">
      <animate attributeName="opacity" values="1;1;.2;1" keyTimes="0;.72;.78;1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g clip-path="url(#titleClip)" font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-11">
    <text x="52" y="296" font-size="170" fill="#ef5a46" opacity=".72">
      TT1NKER
      <animate attributeName="x" values="52;52;45;58;52;52" keyTimes="0;.86;.875;.89;.905;1" dur="6.4s" repeatCount="indefinite"/>
    </text>
    <text x="58" y="296" font-size="170" fill="#17aeb8" opacity=".72">
      TT1NKER
      <animate attributeName="x" values="58;58;66;48;58;58" keyTimes="0;.86;.875;.89;.905;1" dur="6.4s" repeatCount="indefinite"/>
    </text>
    <text x="55" y="296" font-size="170" fill="#f1efe7">TT1NKER</text>
  </g>

  <rect x="56" y="334" width="712" height="4" fill="#ef5a46"/>
  <rect x="300" y="334" width="292" height="4" fill="#17aeb8"/>
  <rect x="592" y="334" width="176" height="4" fill="#cfff2e"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" letter-spacing="2">
    <text x="58" y="382" fill="#f1efe7" font-size="16">SYSTEM ENGINEER / SYSTEM ARTIST</text>
    <text x="58" y="414" fill="#85858d" font-size="11">PROTOCOLS · RUNTIMES · COMPLEX SYSTEMS · STRANGE MACHINES</text>
  </g>

  <g transform="translate(1010 260)">
    <path d="M-120-96C-64-151 58-146 98-78C144 0 81 47 31 77C5 93-7 112-7 143" fill="none" stroke="#f1efe7" stroke-width="46" stroke-linecap="square"/>
    <path d="M-120-96C-64-151 58-146 98-78" fill="none" stroke="#ef5a46" stroke-width="6" transform="translate(-7 3)"/>
    <path d="M98-78C144 0 81 47 31 77" fill="none" stroke="#17aeb8" stroke-width="6" transform="translate(7 -3)"/>
    <rect x="-29" y="174" width="44" height="44" fill="#cfff2e" transform="rotate(8)"/>
    <path d="M-186 0H186M0-178V230" stroke="#f1efe7" stroke-opacity=".12"/>
    <circle r="160" fill="none" stroke="#7357d8" stroke-opacity=".34" stroke-dasharray="2 13">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.7">
    <rect x="52" y="448" width="294" height="112" fill="#ef5a46"/>
    <text x="72" y="478" fill="#0b0b0d">01 / CURRENT SIGNAL</text>
    <text x="72" y="526" fill="#0b0b0d" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="0">CHATCOMMONS</text>

    <rect x="346" y="448" width="294" height="112" fill="#17aeb8"/>
    <text x="366" y="478" fill="#0b0b0d">02 / WORKING TOOLS</text>
    <text x="366" y="526" fill="#0b0b0d" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="0">SHIP / MEASURE</text>

    <rect x="640" y="448" width="294" height="112" fill="#7357d8"/>
    <text x="660" y="478" fill="#f1efe7">03 / SYSTEM STUDIES</text>
    <text x="660" y="526" fill="#f1efe7" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="0">MODEL / BREAK</text>

    <rect x="934" y="448" width="294" height="112" fill="#cfff2e"/>
    <text x="954" y="478" fill="#0b0b0d">04 / OPEN QUESTION</text>
    <text x="954" y="526" fill="#0b0b0d" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="0">WHAT IF?</text>
  </g>

  <rect y="0" width="1280" height="2" fill="#f1efe7" opacity=".55">
    <animate attributeName="y" values="0;560" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.45;0" dur="4.8s" repeatCount="indefinite"/>
  </rect>
</svg>
