<g transform="translate(24, 0)" clip-path="url(#cp4)">
  <text class="txt" x="0" y="130">i want to control my computer.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp5)">
  <text class="txt" x="0" y="152">computer systems are the center — studied as emergent structure,</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp6)">
  <text class="txt" x="0" y="174">engineered upward from instructions, kernels, and the wires.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp7)">
  <text class="txt" x="0" y="196">other domains are field tests for the same lens.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp9)">
  <text class="txt prompt" x="0" y="240">$ </text>
  <text class="txt" x="16.8" y="240">pacman -Qe                              # explicitly installed</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp10)">
  <text class="txt" x="0" y="262">systems    linux · c · c++ · asm · compilers · kernels · stm32 firmware</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp11)">
  <text class="txt" x="0" y="284">explored   ai agents · life sims · neural nets · spatial cognition</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp12)">
  <text class="txt" x="0" y="306">write      vue · python · javascript · single-file apps</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp14)">
  <text class="txt prompt" x="0" y="350">$ </text>
  <text class="txt" x="16.8" y="350">tail -f ~/.thoughts</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp15)">
  <text class="txt thought" x="0" y="372">&gt; programs, not software.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp16)">
  <text class="txt thought" x="0" y="394">&gt; make things that run.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp17)">
  <text class="txt thought" x="0" y="416">&gt; make machines you can read end-to-end.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp18)">
  <text class="txt thought" x="0" y="438">&gt; don't hide weak ideas behind abstractions.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp19)">
  <text class="txt thought" x="0" y="460">&gt; memory matters. identity needs continuity.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp20)">
  <text class="txt thought" x="0" y="482">&gt; ai should become a builder, not just a chatbot.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp21)">
  <text class="txt thought" x="0" y="504">&gt; simulation is how ideas meet reality before reality punishes them.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp22)">
  <text class="txt thought" x="0" y="526">&gt; tools should compose. systems should be inspectable.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp23)">
  <text class="txt thought" x="0" y="548">&gt; polish is not substance.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp24)">
  <text class="txt thought" x="0" y="570">&gt; if it only looks impressive but cannot survive being opened,</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp25)">
  <text class="txt thought" x="0" y="592">  it is not engineering.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp27)">
  <text class="txt prompt" x="0" y="636">$ </text>
  <text class="txt" x="16.8" y="636">cat ~/.ssh/contact.pub</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp28)">
  <text class="txt" x="0" y="658">hostsjimi@gmail.com</text>
</g>
