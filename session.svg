<g transform="translate(24, 0)" clip-path="url(#cp4)">
  <text class="txt" x="0" y="130">studying how low-level rules couple into emergent structure.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp5)">
  <text class="txt" x="0" y="152">from primitives to emergence — compilers, neural nets, agent sims,</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp6)">
  <text class="txt" x="0" y="174">orbital mechanics, place cells. one question, many substrates.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp8)">
  <text class="txt prompt" x="0" y="218">$ </text>
  <text class="txt" x="16.8" y="218">pacman -Qe                              # explicitly installed</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp9)">
  <text class="txt" x="0" y="240">substrate    c · c++ · asm · compilers · stm32 firmware · linux</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp10)">
  <text class="txt" x="0" y="262">emergence    neural nets · agent sims · narrative agents · place cells</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp11)">
  <text class="txt" x="0" y="284">medium       vue · python · javascript · single-file apps</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp13)">
  <text class="txt prompt" x="0" y="328">$ </text>
  <text class="txt" x="16.8" y="328">tail -f ~/.thoughts</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp14)">
  <text class="txt thought" x="0" y="350">&gt; programs, not software.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp15)">
  <text class="txt thought" x="0" y="372">&gt; make things that run.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp16)">
  <text class="txt thought" x="0" y="394">&gt; make machines you can read end-to-end.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp17)">
  <text class="txt thought" x="0" y="416">&gt; don't hide weak ideas behind abstractions.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp18)">
  <text class="txt thought" x="0" y="438">&gt; memory matters. identity needs continuity.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp19)">
  <text class="txt thought" x="0" y="460">&gt; ai should become a builder, not just a chatbot.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp20)">
  <text class="txt thought" x="0" y="482">&gt; simulation is how ideas meet reality before reality punishes them.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp21)">
  <text class="txt thought" x="0" y="504">&gt; tools should compose. systems should be inspectable.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp22)">
  <text class="txt thought" x="0" y="526">&gt; polish is not substance.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp23)">
  <text class="txt thought" x="0" y="548">&gt; if it only looks impressive but cannot survive being opened,</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp24)">
  <text class="txt thought" x="0" y="570">  it is not engineering.</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp26)">
  <text class="txt prompt" x="0" y="614">$ </text>
  <text class="txt" x="16.8" y="614">cat ~/.ssh/contact.pub</text>
</g>
<g transform="translate(24, 0)" clip-path="url(#cp27)">
  <text class="txt" x="0" y="636">hostsjimi@gmail.com</text>
</g>
