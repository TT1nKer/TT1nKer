<text class="txt" x="24" y="130">i build and study controllable systems —</text>
<text class="txt" x="24" y="152">from compilers and machines to ai agents and emergent simulations.</text>
<text class="txt prompt" x="24" y="196">$ </text>
<text class="txt" x="42.0" y="196">pacman -Qe                              # explicitly installed</text>
<text class="txt" x="24" y="218">systems    linux · c · c++ · asm · compilers · kernels · stm32 firmware</text>
<text class="txt" x="24" y="240">explored   ai agents · life sims · neural nets · spatial cognition</text>
<text class="txt" x="24" y="262">write      vue · python · javascript · single-file apps</text>
<text class="txt prompt" x="24" y="306">$ </text>
<text class="txt" x="42.0" y="306">tail -f ~/.thoughts</text>
<text class="txt thought" x="24" y="328">&gt; i want to control my computer, not the other way around.</text>
<text class="txt thought" x="24" y="350">&gt; arch + nvim + tmux. nothing fancy.</text>
<text class="txt thought" x="24" y="372">&gt; i'd rather understand a thing than just use it.</text>
<text class="txt thought" x="24" y="394">&gt; compilers, kernels, agents, sims — same itch, different angles.</text>
<text class="txt thought" x="24" y="416">&gt; half of these repos are works in progress. that's fine.</text>
<text class="txt thought" x="24" y="438">&gt; if i can't read it end-to-end, i don't trust it yet.</text>
<text class="txt prompt" x="24" y="482">$ </text>
