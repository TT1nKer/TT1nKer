<text class="txt prompt" x="24" y="42">$ </text>
<text class="txt" x="40.8" y="42">whoami</text>
<text class="txt" x="24" y="64">tt1nker</text>
<text class="txt prompt" x="24" y="108">$ </text>
<text class="txt" x="40.8" y="108">cat /etc/thesis</text>
<text class="txt" x="24" y="130">i want to control my computer.</text>
<text class="txt" x="24" y="152">computer systems are the center — studied as emergent structure,</text>
<text class="txt" x="24" y="174">engineered upward from instructions, kernels, and the wires.</text>
<text class="txt" x="24" y="196">other domains are field tests for the same lens.</text>
<text class="txt prompt" x="24" y="240">$ </text>
<text class="txt" x="40.8" y="240">pacman -Qe                              # explicitly installed</text>
<text class="txt" x="24" y="262">systems    linux · c · c++ · asm · compilers · kernels · stm32 firmware</text>
<text class="txt" x="24" y="284">explored   ai agents · life sims · neural nets · spatial cognition</text>
<text class="txt" x="24" y="306">write      vue · python · javascript · single-file apps</text>
<text class="txt prompt" x="24" y="350">$ </text>
<text class="txt" x="40.8" y="350">tail -f ~/.thoughts</text>
<text class="txt thought" x="24" y="372">&gt; i want to control my computer, not be controlled by it.</text>
<text class="txt thought" x="24" y="394">&gt; computers are machines to understand, modify, and command.</text>
<text class="txt thought" x="24" y="416">&gt; engineering is the art of making ideas survive constraints.</text>
<text class="txt thought" x="24" y="438">&gt; systems are where simple parts become behavior.</text>
<text class="txt thought" x="24" y="460">&gt; emergence is not magic. it is structure under pressure.</text>
<text class="txt thought" x="24" y="482">&gt; i study compilers, ai agents, simulations, embedded, and full-stack tools</text>
<text class="txt thought" x="24" y="504">&gt; as different paths toward the same question:</text>
<text class="txt thought" x="24" y="526">&gt; how do systems run, adapt, and emerge?</text>
<text class="txt prompt" x="24" y="570">$ </text>
<text class="txt" x="40.8" y="570">cat ~/.ssh/contact.pub</text>
<text class="txt" x="24" y="592">hostsjimi@gmail.com</text>
