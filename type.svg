<rect class="bg" width="735" height="672"/>
<rect x="0.5" y="0.5" width="734" height="671" fill="none" stroke="rgba(255,255,255,0.06)"/>
<text class="txt prompt" x="24.0" y="42" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </text>
<text class="txt" x="42.0" y="42" textLength="54.0" lengthAdjust="spacingAndGlyphs">whoami</text>
<text class="txt" x="24.0" y="64" textLength="63.0" lengthAdjust="spacingAndGlyphs">tt1nker</text>
<text class="txt prompt" x="24.0" y="108" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </text>
<text class="txt" x="42.0" y="108" textLength="135.0" lengthAdjust="spacingAndGlyphs">cat /etc/thesis</text>
<text class="txt" x="24.0" y="130" textLength="270.0" lengthAdjust="spacingAndGlyphs">i want to control my computer.</text>
<text class="txt" x="24.0" y="152" textLength="576.0" lengthAdjust="spacingAndGlyphs">computer systems are the center — studied as emergent structure,</text>
<text class="txt" x="24.0" y="174" textLength="540.0" lengthAdjust="spacingAndGlyphs">engineered upward from instructions, kernels, and the wires.</text>
<text class="txt" x="24.0" y="196" textLength="432.0" lengthAdjust="spacingAndGlyphs">other domains are field tests for the same lens.</text>
<text class="txt prompt" x="24.0" y="240" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </text>
<text class="txt" x="42.0" y="240" textLength="558.0" lengthAdjust="spacingAndGlyphs">pacman -Qe                              # explicitly installed</text>
<text class="txt" x="24.0" y="262" textLength="639.0" lengthAdjust="spacingAndGlyphs">systems    linux · c · c++ · asm · compilers · kernels · stm32 firmware</text>
<text class="txt" x="24.0" y="284" textLength="594.0" lengthAdjust="spacingAndGlyphs">explored   ai agents · life sims · neural nets · spatial cognition</text>
<text class="txt" x="24.0" y="306" textLength="495.0" lengthAdjust="spacingAndGlyphs">write      vue · python · javascript · single-file apps</text>
<text class="txt prompt" x="24.0" y="350" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </text>
<text class="txt" x="42.0" y="350" textLength="171.0" lengthAdjust="spacingAndGlyphs">tail -f ~/.thoughts</text>
<text class="txt thought" x="24.0" y="372" textLength="513.0" lengthAdjust="spacingAndGlyphs">&gt; i want to control my computer, not be controlled by it.</text>
<text class="txt thought" x="24.0" y="394" textLength="540.0" lengthAdjust="spacingAndGlyphs">&gt; computers are machines to understand, modify, and command.</text>
<text class="txt thought" x="24.0" y="416" textLength="549.0" lengthAdjust="spacingAndGlyphs">&gt; engineering is the art of making ideas survive constraints.</text>
<text class="txt thought" x="24.0" y="438" textLength="441.0" lengthAdjust="spacingAndGlyphs">&gt; systems are where simple parts become behavior.</text>
<text class="txt thought" x="24.0" y="460" textLength="513.0" lengthAdjust="spacingAndGlyphs">&gt; emergence is not magic. it is structure under pressure.</text>
<text class="txt thought" x="24.0" y="482" textLength="675.0" lengthAdjust="spacingAndGlyphs">&gt; i study compilers, ai agents, simulations, embedded, and full-stack tools</text>
<text class="txt thought" x="24.0" y="504" textLength="414.0" lengthAdjust="spacingAndGlyphs">&gt; as different paths toward the same question:</text>
<text class="txt thought" x="24.0" y="526" textLength="360.0" lengthAdjust="spacingAndGlyphs">&gt; how do systems run, adapt, and emerge?</text>
<text class="txt prompt" x="24.0" y="570" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </text>
<text class="txt" x="42.0" y="570" textLength="198.0" lengthAdjust="spacingAndGlyphs">cat ~/.ssh/contact.pub</text>
<text class="txt" x="24.0" y="592" textLength="171.0" lengthAdjust="spacingAndGlyphs">hostsjimi@gmail.com</text>
